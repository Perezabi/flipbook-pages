<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flip Book</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #111;
    color: white;
    text-align: center;
}

/* Book container */
.book {
    width: 300px;
    height: 400px;
    margin: 30px auto;
    perspective: 1000px;
    position: relative;
}

/* Page */
.page {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-origin: left;
    transition: transform 1s;
    background: white;
    border: 1px solid #ccc;
    overflow: hidden;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Flip effect */
.page.flipped {
    transform: rotateY(-180deg);
}
</style>
</head>

<body>

<h2 class="mt-3">📖 Flip Book</h2>

<div class="container">
    <input type="file" id="upload" multiple class="form-control mb-3">
    
    <div class="book" id="book"></div>

    <div class="mt-3">
        <button class="btn btn-primary" onclick="prevPage()">⬅ Prev</button>
        <button class="btn btn-success" onclick="nextPage()">Next ➡</button>
    </div>
</div>

<script>
let pages = [];
let currentPage = 0;

// Upload images
document.getElementById("upload").addEventListener("change", function(e) {
    const files = e.target.files;
    const book = document.getElementById("book");
    book.innerHTML = "";
    pages = [];
    currentPage = 0;

    Array.from(files).forEach((file, index) => {
        const reader = new FileReader();

        reader.onload = function(event) {
            const page = document.createElement("div");
            page.className = "page";
            page.style.zIndex = files.length - index;

            const img = document.createElement("img");
            img.src = event.target.result;

            page.appendChild(img);
            book.appendChild(page);
            pages.push(page);
        };

        reader.readAsDataURL(file);
    });
});

// Next page
function nextPage() {
    if (currentPage < pages.length) {
        pages[currentPage].classList.add("flipped");
        currentPage++;
    }
}

// Previous page
function prevPage() {
    if (currentPage > 0) {
        currentPage--;
        pages[currentPage].classList.remove("flipped");
    }
}
</script>

</body>
</html>
