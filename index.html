<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perez | Flipbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
}

/* Book */
#book {
    width: 95%;
    max-width: 900px;
    height: 600px;
    margin: auto;
    transition: transform 0.2s ease;
}

/* Page */
.page {
    background: #fdfcf7;
    overflow: hidden; /* FIX reflection issue */
}

/* Paper texture */
.page::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("https://www.transparenttextures.com/patterns/paper-1.png");
    opacity: 0.15;
    pointer-events: none;
}

/* Remove unwanted shadow/reflection */
.page::after {
    display: none;
}

/* Image */
.page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Cover */
.cover {
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

/* Page number */
.pageNumber {
    position: fixed;
    bottom: 15px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 12px;
    color: white;
    font-size: 14px;
}

/* Book depth */
#book {
    margin-top: 30px;
    box-shadow:
        0 4px 10px rgba(0,0,0,0.4),
        0 10px 30px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div id="book"></div>
<div class="pageNumber" id="pageNumber">1 / 1</div>

<audio id="flipSound" src="https://www.soundjay.com/page-turn/page-flip-01.mp3"></audio>

<script>
let pageFlip;
let totalPages = 0;

/* Init Flipbook */
function initBook() {
    pageFlip = new St.PageFlip(document.getElementById("book"), {
        width: 450,
        height: 600,
        showCover: true,
        maxShadowOpacity: 0.25,
        flippingTime: 500,
        useMouseEvents: true,
        mobileScrollSupport: false,
        swipeDistance: 20
    });

    pageFlip.loadFromHTML(document.querySelectorAll(".page"));

    pageFlip.on("flip", e => {
        updatePageNumber(e.data);
        playSound();
    });
}

/* Render Pages */
function renderPages(images) {
    const book = document.getElementById("book");
    book.innerHTML = "";

    images.forEach((src, i) => {
        const page = document.createElement("div");
        page.className = "page";

        if (i === 0) page.classList.add("cover");

        page.innerHTML = `<img src="${src}">`;
        book.appendChild(page);
    });

    totalPages = images.length;
    initBook();
    updatePageNumber(0);
}

/* Load PDF */
async function loadPDF() {
    const pdf = await pdfjsLib.getDocument("book.pdf").promise;
    let images = [];

    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.5 });

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({ canvasContext: ctx, viewport }).promise;

        images.push(canvas.toDataURL());
    }

    renderPages(images);
}

/* Page Number */
function updatePageNumber(index) {
    document.getElementById("pageNumber").innerText =
        (index + 1) + " / " + totalPages;
}

/* Flip Sound */
function playSound() {
    const s = document.getElementById("flipSound");
    s.currentTime = 0;
    s.play();
}

/* =========================
   FIX: Instant Swipe Flip
========================= */
let startX = 0;

document.addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
    }
});

document.addEventListener("touchmove", e => {
    if (!pageFlip) return;

    let currentX = e.touches[0].clientX;
    let diff = startX - currentX;

    if (diff > 25) {
        pageFlip.flipNext();
        startX = currentX;
    }

    if (diff < -25) {
        pageFlip.flipPrev();
        startX = currentX;
    }
});

/* =========================
   Pinch Zoom
========================= */
let initialDistance = 0;

document.addEventListener("touchmove", e => {
    if (e.touches.length === 2) {
        let dx = e.touches[0].clientX - e.touches[1].clientX;
        let dy = e.touches[0].clientY - e.touches[1].clientY;

        let distance = Math.sqrt(dx*dx + dy*dy);

        if (!initialDistance) initialDistance = distance;

        let zoom = distance / initialDistance;

        document.getElementById("book").style.transform =
            `scale(${zoom})`;
    }
});

document.addEventListener("touchend", () => {
    initialDistance = 0;
});

/* Start */
loadPDF();
</script>

</body>
</html>
