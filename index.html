<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perez | Magazine Flipbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>
body {
    margin: 0;
    background: #0b0b0b;
    font-family: -apple-system, sans-serif;
    color: white;
}

/* Header */
.header {
    text-align: center;
    padding: 10px;
}

/* Upload */
.upload {
    display: block;
    margin: 10px auto;
}

/* Book */
#book {
    width: 95%;
    max-width: 900px;
    height: 600px;
    margin: auto;
}

/* Page */
.page {
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Thumbnails */
.thumbs {
    display: flex;
    overflow-x: auto;
    padding: 10px;
    background: rgba(0,0,0,0.8);
}

.thumb {
    width: 70px;
    height: 90px;
    margin-right: 10px;
    border: 2px solid transparent;
    border-radius: 6px;
    overflow: hidden;
}

.thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.thumb.active {
    border: 2px solid #00ffcc;
}
</style>
</head>

<body>

<div class="header">
    <h2>📖 My Magazine</h2>
    <input type="file" id="upload" class="upload" multiple>
</div>

<div id="book"></div>

<div class="thumbs" id="thumbs"></div>

<audio id="flipSound" src="https://www.soundjay.com/page-turn/page-flip-01.mp3"></audio>

<script>
let pageFlip;
let images = [];

const flipSound = document.getElementById("flipSound");

/* Upload */
document.getElementById("upload").addEventListener("change", e => {
    const files = e.target.files;
    const book = document.getElementById("book");
    const thumbs = document.getElementById("thumbs");

    book.innerHTML = "";
    thumbs.innerHTML = "";
    images = [];

    let pagesHTML = "";

    Array.from(files).forEach((file, i) => {
        const url = URL.createObjectURL(file);
        images.push(url);

        pagesHTML += `
            <div class="page">
                <img src="${url}">
            </div>
        `;

        // thumbnails
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.innerHTML = `<img src="${url}">`;

        thumb.onclick = () => {
            pageFlip.flip(i);
        };

        thumbs.appendChild(thumb);
    });

    book.innerHTML = pagesHTML;

    pageFlip = new St.PageFlip(book, {
        width: 450,
        height: 600,
        size: "stretch",
        showCover: true,
        mobileScrollSupport: false,
        useMouseEvents: true,
        maxShadowOpacity: 0.5
    });

    pageFlip.loadFromHTML(document.querySelectorAll(".page"));

    /* Events */
    pageFlip.on("flip", e => {
        flipSound.currentTime = 0;
        flipSound.play();
        updateActive(e.data);
    });

    updateActive(0);
});

/* Highlight active thumb */
function updateActive(index) {
    document.querySelectorAll(".thumb").forEach((t, i) => {
        t.classList.toggle("active", i === index);
    });
}

/* Keyboard navigation */
document.addEventListener("keydown", e => {
    if (!pageFlip) return;

    if (e.key === "ArrowRight") pageFlip.flipNext();
    if (e.key === "ArrowLeft") pageFlip.flipPrev();
});
</script>

</body>
</html>
